services:
  - type: web
    name: gravador-de-tela-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build
    startCommand: npm run migrate:up && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MAX_UPLOAD_BYTES
        value: "524288000"
      - key: SHARE_LINK_TTL_HOURS
        value: "72"
